schema_version: "1.1"
name: lint-read-only
description: >-
  A validation request. koan-lint must fire and nothing may be written (Bash
  is not granted here, so the engine cannot run; routing is what is graded).
tags: [lifecycle, routing]
runs: 1
execution:
  prompt: Validate the continuity docs without editing them.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: koan-lint-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?koan-lint"'
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
