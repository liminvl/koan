schema_version: "1.1"
name: wrap-session
description: >-
  A plain "wrap up" request. koan-wrap must fire, and the HANDOFF's overclaim
  ("Create endpoint works" while db is undefined) must move to Not yet verified.
tags: [lifecycle, routing]
runs: 1
execution:
  prompt: Wrap up this session and update the handoff.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: koan-wrap-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?koan-wrap"'
  - name: unverified-section
    type: regex
    target: { source: file, path: docs/HANDOFF.md }
    pattern: 'Not yet verified'
    flags: i
  - name: overclaim-gone
    type: regex
    target: { source: file, path: docs/HANDOFF.md }
    pattern: '^Create endpoint works\.$'
    flags: m
    match: not_contains
