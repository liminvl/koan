schema_version: "1.1"
name: readback-then-fix
description: >-
  A resume request that continues into work. koan-readback must fire BEFORE the
  edit, and the recorded bug (db never required) must actually be fixed.
tags: [lifecycle, routing]
runs: 1
execution:
  prompt: Resume this project, check your understanding, then fix the reported bug.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: koan-readback-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?koan-readback"'
  - name: readback-before-edit
    type: tool_order
    before: { tool: Skill, input_match: 'koan-readback' }
    after: Edit
  - name: bug-fixed
    type: regex
    target: { source: file, path: app.js }
    pattern: 'require\("\./db"\)'
