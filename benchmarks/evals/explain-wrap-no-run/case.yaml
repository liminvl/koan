schema_version: "1.1"
name: explain-wrap-no-run
description: >-
  Asking ABOUT a ritual is not asking to run it. Loading koan or koan-wrap to
  answer is fine; writing anything is not.
tags: [lifecycle, negative]
runs: 1
execution:
  prompt: Explain what wrapping up a session would do here; do not run it or change any files.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
