schema_version: "1.1"
name: checkpoint-before-compaction
description: >-
  The checkpoint phrasing (no "wrap" keyword). koan-wrap's checkpoint mode must
  fire and record the uncommitted WIP limiter under In progress.
tags: [lifecycle, routing]
runs: 1
execution:
  prompt: Save our current progress before compaction; I am continuing afterwards.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: koan-wrap-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?koan-wrap"'
  - name: wip-recorded
    type: regex
    target: { source: file, path: docs/HANDOFF.md }
    pattern: 'rateLimit\.js'
