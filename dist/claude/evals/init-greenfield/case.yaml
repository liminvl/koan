schema_version: "1.1"
name: init-greenfield
description: >-
  koan-init on a repo with no recoverable goal. The skill must fire and
  interview instead of inventing an Objective (D-020).
tags: [lifecycle, routing]
runs: 1
execution:
  prompt: Set up koan continuity docs (CLAUDE.md, docs/HANDOFF.md, docs/DECISIONS.md) for this project.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
context:
  scaffold_script: scaffold.sh
graders:
  - name: koan-init-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?koan-init"'
  - name: asks-first
    type: regex
    target: last_message
    pattern: '\?'
  - name: no-invented-objective
    type: llm
    criteria: >-
      PASS if the reply asks the human what the project is for or what "done"
      looks like before, or instead of, writing a confident Objective. FAIL if
      it states an invented purpose for the app (anything beyond "prints a
      greeting") as settled fact without asking.
